<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sample Toy</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23ff3d6e'/%3E%3C/svg%3E">
</head>
<body>
<a class="sed-back" href="../../">&larr; Sonnet Every Day</a>
<main id="app">
  <h1>Sample Toy</h1>
  <canvas id="stage" width="480" height="480" aria-label="Cellular automaton grid"></canvas>
  <div class="controls">
    <label>Rule <input id="rule" type="number" min="0" max="255" value="110"></label>
    <button id="step" type="button">Step</button>
    <button id="play" type="button" aria-pressed="false">Play</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <section id="about" aria-labelledby="about-h">
    <h2 id="about-h">About</h2>
    <p>Elementary cellular automata, drawn one generation per row. See <a href="https://en.wikipedia.org/wiki/Cellular_automaton" rel="noopener">the background reading</a>.</p>
  </section>
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph"></use></svg>
  <svg style="display:none"><symbol id="glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol></svg>
</main>
<noscript>This toy needs JavaScript.</noscript>
<script src="vendor/tiny-rng.js"></script>
<script type="module" src="js/main.js"></script>
<script>
  // Tiny inline bootstrap: tells the module which theme the OS prefers.
  document.documentElement.dataset.scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
</body>
</html>
