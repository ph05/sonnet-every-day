# Model-free safety net. If the day still has no published page at 09:40 New York
# time (after the 09:30 grace period, config.json schedule.graceUntil), scripts/
# deadman.mjs publishes the best fallback it can (Ideas Day if the researched
# ideas exist, otherwise a Postcard), rebuilds the site and pushes. It needs no
# Claude session, so it still works when the subscription is exhausted.
#
# IMPORTANT: GitHub only runs `schedule` triggers from the repository's DEFAULT
# branch. The daily build lives on the work branch (config.json "workBranch"); the
# sync-main workflow fast-forwards `main` to every push of the work branch, so the
# copy of this file on `main` stays current. Manual dispatch ("Run workflow" in the
# Actions tab) always works, whatever branch holds the file.
#
# Two cron lines because GitHub cron is UTC: 13:40 is 09:40 in EDT, 14:40 is 09:40
# in EST. The script ignores a run that is too early (before the grace period plus
# a few minutes) or whose lease is still alive (until the 10:30 hard stop), and it
# never touches a day that is already published, so the extra run is harmless.
name: deadman

on:
  schedule:
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish a fallback now even if it is too early or the run looks alive'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: deadman
  cancel-in-progress: false

jobs:
  deadman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # The default branch only supplies config.json, which names the branch the
      # daily build publishes to. A plain (non-sparse) checkout: a sparse checkout
      # followed by a second checkout into the same directory leaves the tree
      # sparse, and `scripts/deadman.mjs` was then missing on the runner.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the work branch from config.json
        id: cfg
        run: |
          set -euo pipefail
          branch="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('config.json','utf8')).workBranch)")"
          if [ -z "$branch" ]; then
            echo "config.json has no workBranch" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "work branch: $branch"

      # The checkout action keeps the token in the git config, so these git
      # commands (and the push inside deadman.mjs) are authenticated.
      - name: Check out the work branch
        env:
          BRANCH: ${{ steps.cfg.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          test -f scripts/deadman.mjs
          git log -1 --oneline

      - name: Publish a fallback if the day is unpublished
        id: deadman
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/deadman.mjs "${args[@]}" | tee "$RUNNER_TEMP/deadman.json"
          action="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).action))" "$RUNNER_TEMP/deadman.json")"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      # The push went to the work branch; sync-main carries it to `main`, where
      # GitHub Pages builds from. A push made with GITHUB_TOKEN does not start
      # other workflows, so do the fast-forward and the Pages build request here.
      - name: Fast-forward main and request a Pages build
        if: steps.deadman.outputs.action == 'published'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cfg.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor origin/main "origin/${BRANCH}"; then
            git push origin "origin/${BRANCH}:refs/heads/main"
          else
            echo "::warning::main is not an ancestor of ${BRANCH}; merge main into the work branch once (ops/OPERATING.md)"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
